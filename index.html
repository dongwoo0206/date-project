<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나랑 데이트 할래?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: '맑은 고딕', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #yesBtn {
            background-color: #ff9999;
            color: white;
        }

        #yesBtn:hover {
            background-color: #ff6666;
        }

        #noBtn {
            background-color: #cccccc;
            color: white;
            /* 도망가는 애니메이션을 부드럽게 만들어주는 옵션 */
            transition: top 0.2s ease, left 0.2s ease, background-color 0.2s ease; 
        }

        .success-message {
            font-size: 1.5rem;
            color: #555;
            margin-top: 10px;
            margin-bottom: 30px; /* 아래 버튼과의 간격 띄우기 */
        }

        /* 다시 도전해보기 버튼 꾸미기 */
        #resetBtn {
            background-color: #99ccff;
            color: white;
            font-size: 1.2rem;
            padding: 10px 20px;
        }

        #resetBtn:hover {
            background-color: #66b3ff;
        }
    </style>
</head>
<body>

    <!-- 첫 번째 화면: 질문과 버튼 -->
    <div id="questionScreen" class="screen">
        <h1>나랑 데이트 할래? 👀</h1>
        <div class="button-container">
            <button id="yesBtn">응 좋아! ❤️</button>
            <button id="noBtn">싫어.. 💔</button>
        </div>
    </div>

    <!-- 두 번째 화면: 성공 시 나타날 화면 -->
    <div id="successScreen" class="screen" style="display: none;">
        <h1>야호! 데이트 확정! 🎉</h1>
        <p class="success-message">기대할게! 조만간 연락할게 ❤️</p>
        <!-- 다시 도전해보기 버튼 추가 -->
        <button id="resetBtn">다시 도전해보기 🔄</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const resetBtn = document.getElementById('resetBtn');
        const questionScreen = document.getElementById('questionScreen');
        const successScreen = document.getElementById('successScreen');

        // '싫어..' 버튼 도망가는 기능
        noBtn.addEventListener('mouseover', function() {
            this.style.position = 'absolute';
            
            const x = Math.random() * (window.innerWidth - this.offsetWidth);
            const y = Math.random() * (window.innerHeight - this.offsetHeight);
            
            this.style.left = `${x}px`;
            this.style.top = `${y}px`;
        });

        // '응 좋아!' 버튼 클릭 시 화면 전환
        yesBtn.addEventListener('click', function() {
            questionScreen.style.display = 'none';
            successScreen.style.display = 'flex';
        });

        // '다시 도전해보기' 버튼 클릭 시 초기화
        resetBtn.addEventListener('click', function() {
            // 1. 성공 화면 숨기고 질문 화면 다시 띄우기
            successScreen.style.display = 'none';
            questionScreen.style.display = 'flex';

            // 2. 도망갔던 '싫어..' 버튼 위치를 원래대로 복구하기
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
        });
    </script>

</body>
</html>
